name: Atualizar Dashboard Eleva Brasil

on:
  schedule:
    # A cada hora, das 08h as 19h no horario de Brasilia (GitHub Actions usa
    # UTC; Brasilia = UTC-3, sem horario de verao). 11h-22h UTC = 08h-19h BRT.
    - cron: "0 11-22 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions, a qualquer hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Gerar dados (build_dashboard.py via API LOC1)
        env:
          LOC1_BASE_URL: ${{ secrets.LOC1_BASE_URL }}
          LOC1_USER: ${{ secrets.LOC1_USER }}
          LOC1_PASSWORD: ${{ secrets.LOC1_PASSWORD }}
          LOC1_CONNECTION_ID: ${{ secrets.LOC1_CONNECTION_ID }}
          LOC1_SOURCE: api
          LOC1_FATURAMENTO_DESDE: "2025-01-01"
        run: python3 build_dashboard.py

      - name: Gerar HTML final
        run: python3 generate_html.py

      - name: Preparar pasta de publicação
        run: |
          mkdir -p _site
          cp dashboard_eleva.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
